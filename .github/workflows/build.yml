name: Build macOS app

on:
  push:
  pull_request:

jobs:
  build-arm64:
    # GitHub's macos-15 standard runner is Apple Silicon (arm64).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/CodePad.app CodePad-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodePad-macos-arm64
          path: CodePad-macos-arm64.zip
